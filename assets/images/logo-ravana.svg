<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 65" width="280" height="65" fill="none">
  <defs>
    <linearGradient id="ravanaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="50%" stop-color="#FFA800"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
    <linearGradient id="ravanaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F60"/>
      <stop offset="100%" stop-color="#00358E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF6B00" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Brand Icon Badge -->
  <g transform="translate(6, 6)" filter="url(#glow)">
    <!-- Outer Shield / Circle with Sun Rays -->
    <circle cx="26" cy="26" r="24" fill="url(#ravanaBlue)"/>
    <circle cx="26" cy="26" r="22" stroke="url(#ravanaGold)" stroke-width="1.8" fill="none"/>
    <!-- Sunburst / Compass Crown Motif -->
    <path d="M26 8 L29 16 L37 13 L33 21 L41 22 L35 28 L41 33 L33 34 L36 42 L29 38 L26 46 L23 38 L16 42 L19 34 L11 33 L17 28 L11 22 L19 21 L15 13 L23 16 Z" fill="url(#ravanaGold)" opacity="0.35"/>
    <!-- Stylized 'R' / Bird Wing Motif -->
    <path d="M20 15 L28 15 C33 15 36 18 36 22 C36 25.5 33.5 28 29.5 28.5 L36 38 H30.5 L24.8 29.5 H23.5 V38 H19.5 V15 Z M23.5 18.5 V26 H27.5 C30 26 31.8 24.5 31.8 22.2 C31.8 20 30 18.5 27.5 18.5 Z" fill="#FFFFFF"/>
    <!-- Accent Diamond Dot -->
    <circle cx="34" cy="18" r="2" fill="url(#ravanaGold)"/>
  </g>
  <!-- Brand Typography -->
  <text x="68" y="35" font-family="'Space Grotesk', 'Outfit', -apple-system, sans-serif" font-weight="800" font-size="27" fill="#001853" letter-spacing="1.5">RAVANA</text>
  <text x="69" y="50" font-family="'Outfit', -apple-system, sans-serif" font-weight="700" font-size="9.5" fill="#FF6B00" letter-spacing="3.8">TOURS (PVT) LTD</text>
  <text x="215" y="50" font-family="'Outfit', -apple-system, sans-serif" font-weight="600" font-size="8" fill="#667085" letter-spacing="1.2">SRI LANKA</text>
</svg>
